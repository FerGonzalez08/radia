name: CI

# Se ejecuta en cada solicitud de integración y en cada push a main/develop.
# Para que sea obligatorio, activar la protección de la rama main (Settings > Branches) y marcar como requeridos los
# checks de los tres trabajos: "Pruebas (...)" (uno por servicio), "Frontend (lint y build)" e "Imagen Docker (...)".
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Pruebas (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15   # una prueba de WebSocket que se cuelgue no debe dejar el flujo corriendo indefinidamente
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, role-service, navigation-service, chat-service]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # El nombre de la base debe contener "test": las pruebas la vacían y se niegan a correr contra otra.
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/radia_test
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements-test.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Pruebas con cobertura (mínimo 80 %, meta del KPI de OE3)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Análisis estático (oxlint)
        run: npm run lint
      - name: Compilación (tsc + vite)
        run: npm run build

  docker:
    name: Imagen Docker (${{ matrix.context }})
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        context: [services/auth-service, services/role-service, services/navigation-service, services/chat-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
