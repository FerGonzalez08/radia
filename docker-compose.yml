services:
  auth-db:
    image: postgres:16-alpine
    container_name: radia-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
    container_name: radia-auth-service
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    env_file:
      - ./services/auth-service/.env
    ports:
      - "8001:8000"
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./services/auth-service/app:/app/app

  role-db:
    image: postgres:16-alpine
    container_name: radia-role-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: role_user
      POSTGRES_PASSWORD: role_pass
      POSTGRES_DB: role_db
    ports:
      - "5434:5432"
    volumes:
      - role_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U role_user -d role_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  role-service:
    build:
      context: ./services/role-service
    container_name: radia-role-service
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    env_file:
      - ./services/role-service/.env
    ports:
      - "8002:8000"
    depends_on:
      role-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./services/role-service/app:/app/app

  navigation-db:
    image: postgres:16-alpine
    container_name: radia-navigation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nav_user
      POSTGRES_PASSWORD: nav_pass
      POSTGRES_DB: navigation_db
    ports:
      - "5435:5432"
    volumes:
      - navigation_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav_user -d navigation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  navigation-service:
    build:
      context: ./services/navigation-service
    container_name: radia-navigation-service
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    env_file:
      - ./services/navigation-service/.env
    ports:
      - "8003:8000"
    depends_on:
      navigation-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./services/navigation-service/app:/app/app
    
  chat-db:
    image: postgres:16-alpine
    container_name: radia-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
      POSTGRES_DB: chat_db
    ports:
      - "5436:5432"
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-service:
    build:
      context: ./services/chat-service
    container_name: radia-chat-service
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    env_file:
      - ./services/chat-service/.env
    ports:
      - "8004:8000"
    depends_on:
      chat-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      navigation-service:
        condition: service_started
    volumes:
      - ./services/chat-service/app:/app/app

volumes:
  auth_db_data:
  role_db_data:
  navigation_db_data:
  chat_db_data:
